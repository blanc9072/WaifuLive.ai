<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../tokens.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Georgia, serif; }
    body {
      background: #FAF8F5;
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      border-radius: 16px; overflow: hidden;
      border: 1px solid #DDD8D0;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      -webkit-app-region: no-drag;
    }
    #titlebar {
      -webkit-app-region: drag;
      background: white;
      padding: 12px 16px 10px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #EDE9E3; flex-shrink: 0;
    }
    #titlebar h1 { font-size: 18px; font-weight: 700; color: #2C2C2C; letter-spacing: -0.5px; }
    .titlebar-btn {
      -webkit-app-region: no-drag;
      width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid #DDD8D0; background: #F0EDE8;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 16px; transition: all 0.2s;
    }
    #micBtn.active { background: #B5D99C; border-color: #4A6741; }
    #chips {
      background: #FAF8F5; padding: 8px 16px;
      display: flex; gap: 8px;
      border-bottom: 1px solid #EDE9E3; flex-shrink: 0;
    }
    .chip {
      background: white; border: 1px solid #DDD8D0;
      border-radius: 20px; padding: 3px 10px;
      font-size: 11px; color: #666; font-weight: 500;
    }
    #messages {
      flex: 1; overflow-y: auto;
      padding: 12px 16px;
      display: flex; flex-direction: column; gap: 8px;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: #DDD8D0; border-radius: 2px; }
    .bubble {
      max-width: 75%; padding: 9px 13px;
      border-radius: 16px; font-size: 13px;
      line-height: 1.45; word-wrap: break-word;
    }
    .bubble.user {
      align-self: flex-end; background: #B5D99C;
      color: #2C4A23; border-bottom-right-radius: 4px;
    }
    .bubble.pistachio {
      align-self: flex-start; background: white;
      color: #2C2C2C; border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    #typing { display: none; align-self: flex-start; }
    #typing.show { display: flex; }
    .dot {
      width: 6px; height: 6px; background: #4A6741;
      border-radius: 50%; margin: 0 2px;
      animation: bounce 1s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    #inputbar {
      background: white; border-top: 1px solid #EDE9E3;
      padding: 10px 12px; display: flex; gap: 8px;
      align-items: center; flex-shrink: 0;
    }
    #input {
      flex: 1; background: #F5F2EE;
      border: 1px solid #DDD8D0; border-radius: 20px;
      padding: 8px 14px; font-size: 13px;
      font-family: Georgia, serif; outline: none; color: #2C2C2C;
    }
    #input:focus { border-color: #4A6741; }
    #sendBtn {
      width: 36px; height: 36px; border-radius: 50%;
      background: #4A6741; border: none; color: white;
      font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #empty {
      flex: 1; display: flex; align-items: center;
      justify-content: center; color: rgba(0,0,0,0.15);
      font-style: italic; font-size: 13px;
    }

    /* ── Dictation button ──────────────────────────────────────────── */
    #dictBtn {
      width: 34px; height: 34px; flex-shrink: 0;
      border-radius: var(--radius-full);
      border: 1.5px solid var(--color-border);
      background: transparent;
      color: var(--color-text-muted);
      font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition:
        background   var(--duration-normal) var(--ease),
        border-color var(--duration-normal) var(--ease),
        color        var(--duration-normal) var(--ease),
        opacity      var(--duration-normal) var(--ease);
    }
    #dictBtn:hover:not(:disabled):not([data-state="listening"]) {
      background: var(--color-surface-2);
      color: var(--color-text-secondary);
    }
    /* Listening state: sage accent + breathing pulse so it's unmistakable */
    #dictBtn[data-state="listening"] {
      background:   var(--color-accent-subtle);
      border-color: var(--color-accent);
      color:        var(--color-accent);
      animation: dictate-breathe 1.8s ease-in-out infinite;
    }
    /* Processing state: neutral, cursor:wait */
    #dictBtn[data-state="processing"] {
      background:   var(--color-surface-2);
      border-color: var(--color-border);
      color:        var(--color-text-muted);
      cursor: wait;
    }
    /* Denied / disabled state */
    #dictBtn[data-state="denied"],
    #dictBtn:disabled {
      color:        var(--color-neutral);
      border-color: var(--color-border);
      opacity: 0.55;
      cursor: not-allowed;
    }
    @keyframes dictate-breathe {
      0%, 100% { opacity: 1;    transform: scale(1);    }
      50%       { opacity: 0.55; transform: scale(0.93); }
    }

    /* Permission-denied explanation below the input bar */
    #dictError {
      display: none;
      padding: var(--space-sm) var(--space-md);
      background: var(--color-surface-2);
      border-top: 1px solid var(--color-border);
      font-size: var(--font-size-xs);
      line-height: var(--line-height-normal);
      color: var(--color-text-secondary);
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="titlebar">
    <h1>Pistachio</h1>
    <div style="display:flex;gap:6px;-webkit-app-region:no-drag">
      <button id="settingsBtn" class="titlebar-btn" title="Settings">⚙</button>
      <button id="micBtn"      class="titlebar-btn" title="Cmd+Shift+M">🎙</button>
    </div>
  </div>
  <div id="chips">
    <span class="chip" id="chipMood">😶 chill</span>
    <span class="chip" id="chipActivity">🕐 unknown</span>
    <span class="chip" id="chipLocation">📍 unknown</span>
  </div>
  <div id="messages">
    <div id="empty">say something...</div>
    <div id="typing" class="bubble pistachio">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>
  <div id="inputbar">
    <button id="dictBtn" data-state="idle" title="Dictate — click to start">🎙</button>
    <input id="input" type="text" placeholder="message pistachio..." />
    <button id="sendBtn">↑</button>
  </div>
  <div id="dictError">
    Microphone access is needed for dictation. Enable it in<br>
    System Settings › Privacy &amp; Security › Microphone, then relaunch.
  </div>

  <script>
  const LIVE_WS = 'ws://localhost:8765';

  // Display name comes from the verified session, not hardcoded.
  // Falls back to 'user' if the IPC call fails for any reason.
  let USERNAME = 'user';
  window.electronAPI.getUser().then(u => { if (u?.email) USERNAME = u.email.split('@')[0]; });

  const messagesEl   = document.getElementById('messages');
  const inputEl      = document.getElementById('input');
  const typingEl     = document.getElementById('typing');
  const emptyEl      = document.getElementById('empty');
  const micBtn       = document.getElementById('micBtn');
  const chipMood     = document.getElementById('chipMood');
  const chipActivity = document.getElementById('chipActivity');
  const chipLocation = document.getElementById('chipLocation');

  let micOn        = false;
  let ws           = null;
  let audioCtx     = null;
  let mediaStream  = null;
  let processor    = null;
  let audioQueue   = [];
  let isPlaying    = false;
  let nextPlayTime = 0;
  let transcriptBuffer = '';
  let transcriptTimer  = null;

  const bc = new BroadcastChannel('pistachio');

  // ---------------------------------------------------------------------------
  // UI helpers
  // ---------------------------------------------------------------------------
  function addBubble(text, isUser) {
    emptyEl.style.display = 'none';
    const div = document.createElement('div');
    div.className = `bubble ${isUser ? 'user' : 'pistachio'}`;
    div.textContent = text;
    messagesEl.insertBefore(div, typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setTyping(show) {
    typingEl.className = `bubble pistachio${show ? ' show' : ''}`;
    if (show) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function updateChips(mood, activity, location) {
    chipMood.textContent     = `😶 ${mood}`;
    chipActivity.textContent = `🕐 ${activity}`;
    chipLocation.textContent = `📍 ${location}`;
  }

  // ---------------------------------------------------------------------------
  // Emotion classifier
  // ---------------------------------------------------------------------------
  function classifyEmotion(text) {
    const t = text.toLowerCase();
    if (/miss|lonely|sad|cry|hurt|pain|tear|sobbing/.test(t))                               return 'cry';
    if (/annoy|jealous|mad|angry|sulk|hmph/.test(t))                                        return 'black face';
    if (/shy|embarrass|blush|flustered/.test(t))                                            return 'shyness';
    if (/love you|adore|cherish|only you|kiss|hug|darling|my love|baby|sweetheart/.test(t)) return 'Love eye';
    if (/excited|yay|amazing|wow|happy|glad|fun/.test(t))                                   return 'Y Hand Posture';
    if (/money|rich|expensive|cost|pay|afford/.test(t))                                     return 'Money Hand Posture';
    if (/phone|text|call|message|discord/.test(t))                                          return 'Phone Hand Posture';
    if (/chill|relax|boba|milk tea/.test(t))                                                return 'Milk Tea';
    if (/sit|tired|rest|couch|bed/.test(t))                                                 return 'sitting position';
    return null;
  }

  // ---------------------------------------------------------------------------
  // Text chat with screenshot
  // ---------------------------------------------------------------------------
  function shouldCaptureScreen(text) {
    return /\b(screen|display|desktop|monitor|what('s| is) (on|happening|going on|showing)|look at (this|my)|can you see)\b/i.test(text);
  }

  async function sendMessage(text) {
    if (!text.trim()) return;
    addBubble(text, true);
    inputEl.value = '';
    setTyping(true);

    let screenshotB64 = null;
    if (window.electronAPI?.captureScreen && shouldCaptureScreen(text)) {
      try {
        const dataUrl = await window.electronAPI.captureScreen();
        if (dataUrl) {
          screenshotB64 = dataUrl.split(',')[1];
        } else {
          console.warn('[chat] Screenshot null — Screen Recording permission may not be granted.');
        }
      } catch (e) {
        console.warn('[chat] Screenshot capture threw:', e);
      }
    }

    try {
      // Routed through main.js — token is injected there, never in this renderer.
      const data = await window.electronAPI.sendChat({
        username:   USERNAME,
        message:    text,
        screenshot: screenshotB64,
      });
      setTyping(false);
      addBubble(data.reply, false);

      const wm = data.working_memory || {};
      updateChips(wm.mood || 'chill', wm.activity || 'unknown', wm.location || 'unknown');

      bc.postMessage({ type: 'reply_expression', expression: classifyEmotion(data.reply) });
      bc.postMessage({ type: 'set_mood', mood: wm.mood || 'chill' });

      if (data.audio_b64) playTtsAudio(data.audio_b64);
    } catch (e) {
      setTyping(false);
      addBubble('(could not reach backend — is main.py running?)', false);
      console.error(e);
    }
  }

  document.getElementById('sendBtn').onclick    = () => sendMessage(inputEl.value);
  document.getElementById('settingsBtn').onclick = () => window.electronAPI.openSettings();
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(inputEl.value); });

  // ---------------------------------------------------------------------------
  // Audio playback
  // ---------------------------------------------------------------------------
  function ensureAudioCtx() {
    if (!audioCtx) audioCtx = new AudioContext({ sampleRate: 24000 });
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function enqueueAudio(buf) {
    audioQueue.push(buf);
    if (!isPlaying) playNext();
  }

  function playNext() {
    if (!audioQueue.length) { isPlaying = false; return; }
    isPlaying = true;
    const ctx    = ensureAudioCtx();
    const buf    = audioQueue.shift();
    const source = ctx.createBufferSource();
    source.buffer = buf;
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    analyser.connect(ctx.destination);
    const startAt = Math.max(ctx.currentTime, nextPlayTime);
    source.start(startAt);
    nextPlayTime = startAt + buf.duration;
    const data = new Uint8Array(analyser.frequencyBinCount);
    const lip  = setInterval(() => {
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a, b) => a + b, 0) / data.length;
      bc.postMessage({ type: 'mouth_open', value: Math.min(1, avg / 60) });
    }, 30);
    source.addEventListener('ended', () => { clearInterval(lip); playNext(); });
  }

  function decodeAndEnqueue(arrayBuffer) {
    const ctx = ensureAudioCtx();
    const i16 = new Int16Array(arrayBuffer);
    const f32 = new Float32Array(i16.length);
    for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
    const buf = ctx.createBuffer(1, f32.length, 24000);
    buf.copyToChannel(f32, 0);
    enqueueAudio(buf);
  }

  // ---------------------------------------------------------------------------
  // TTS playback — engine-agnostic: just decodes whatever bytes the backend
  // returned (MP3, Ogg, etc.) via the browser's built-in codec support.
  // ---------------------------------------------------------------------------
  async function playTtsAudio(b64) {
    const ctx = ensureAudioCtx();
    const binary = atob(b64);
    const bytes  = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);

    let audioBuffer;
    try {
      audioBuffer = await ctx.decodeAudioData(bytes.buffer);
    } catch (e) {
      console.warn('[tts] decodeAudioData failed:', e);
      return;
    }

    const source   = ctx.createBufferSource();
    source.buffer  = audioBuffer;
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    source.connect(analyser);
    analyser.connect(ctx.destination);
    source.start();

    const freqData = new Uint8Array(analyser.frequencyBinCount);
    let smooth = 0;
    const lip = setInterval(() => {
      analyser.getByteFrequencyData(freqData);
      const raw  = freqData.reduce((a, b) => a + b, 0) / freqData.length;
      smooth     = smooth * 0.6 + (raw / 80) * 0.4;
      bc.postMessage({ type: 'mouth_open', value: Math.min(1, smooth) });
    }, 30);

    source.addEventListener('ended', () => clearInterval(lip));
  }

  // ---------------------------------------------------------------------------
  // Voice transcript accumulator
  // ---------------------------------------------------------------------------
  function accumulateTranscript(text) {
    transcriptBuffer += (transcriptBuffer ? ' ' : '') + text;
    clearTimeout(transcriptTimer);
    transcriptTimer = setTimeout(() => {
      if (!transcriptBuffer.trim()) return;
      addBubble(transcriptBuffer.trim(), false);
      bc.postMessage({ type: 'reply_expression', expression: classifyEmotion(transcriptBuffer) });
      transcriptBuffer = '';
    }, 800);
  }

  // ---------------------------------------------------------------------------
  // Mic
  // ---------------------------------------------------------------------------
  async function startMic() {
    const ctx   = ensureAudioCtx();
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const src   = ctx.createMediaStreamSource(mediaStream);
    processor   = ctx.createScriptProcessor(4096, 1, 1);
    processor.onaudioprocess = (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const f32 = e.inputBuffer.getChannelData(0);
      const i16 = new Int16Array(f32.length);
      for (let i = 0; i < f32.length; i++) i16[i] = Math.max(-32768, Math.min(32767, f32[i] * 32768));
      ws.send(i16.buffer);
    };
    src.connect(processor);
    processor.connect(ctx.destination);
  }

  function stopMic() {
    if (processor)   { processor.disconnect(); processor = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
  }

  // ---------------------------------------------------------------------------
  // WebSocket voice
  // ---------------------------------------------------------------------------
  function connectVoice() {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    ws = new WebSocket(LIVE_WS);
    ws.binaryType = 'arraybuffer';
    ws.onopen    = async () => { await startMic(); };
    ws.onclose   = ()       => { stopMic(); };
    ws.onerror   = (e)      => console.error('[Voice]', e);
    ws.onmessage = (event)  => {
      if (event.data instanceof ArrayBuffer) {
        decodeAndEnqueue(event.data);
      } else {
        try {
          const m = JSON.parse(event.data);
          if (m.type === 'transcript')       accumulateTranscript(m.text);
          if (m.type === 'input_transcript') addBubble(m.text, true);
        } catch (_) {}
      }
    };
  }

  function disconnectVoice() {
    stopMic();
    if (ws) { ws.close(); ws = null; }
    audioQueue = []; isPlaying = false; nextPlayTime = 0;
  }

  function toggleMic() {
    micOn = !micOn;
    micBtn.classList.toggle('active', micOn);
    micBtn.textContent = micOn ? '🎙' : '🔇';
    if (micOn) connectVoice(); else disconnectVoice();
  }

  micBtn.onclick = toggleMic;

  if (window.electronAPI) {
    window.electronAPI.onToggleMic(() => toggleMic());
  }

  // ---------------------------------------------------------------------------
  // Dictation — local on-device STT via Whisper (base.en)
  //
  // Streaming strategy: VAD-based chunking.
  // RMS energy is computed every audio frame; when silence ≥ SILENCE_MS is
  // detected after speech, the buffered utterance is flushed to Whisper and
  // the transcript is appended to the input box.  A force-flush fires after
  // MAX_UTTERANCE_MS regardless of pauses.  Text appears progressively as
  // you speak — not word-by-word, but utterance-by-utterance.
  //
  // A serialized promise queue (dictQ) prevents out-of-order appends when
  // multiple chunks are in flight concurrently.
  // ---------------------------------------------------------------------------

  const SILENCE_THRESHOLD  = 0.01;   // RMS below this = silence
  const SILENCE_MS         = 700;    // ms of silence → flush current utterance
  const MAX_UTTERANCE_MS   = 9000;   // force-flush after 9 s even without pause
  const MIN_UTTERANCE_SAMP = 6400;   // ~0.15 s at 44 kHz — skip shorter clips

  const dictBtn   = document.getElementById('dictBtn');
  const dictError = document.getElementById('dictError');

  let dictState     = 'idle';
  let dictStream    = null;
  let dictCtx       = null;
  let dictSource    = null;
  let dictProcessor = null;
  let dictRate      = 44100;
  let dictChunks    = [];          // accumulates PCM for the current utterance
  let dictHasSpeech = false;
  let dictSilTimer  = null;
  let dictUttStart  = 0;
  let dictQ         = Promise.resolve();   // serialises IPC calls → in-order text

  function applyDictState(state) {
    dictState             = state;
    dictBtn.dataset.state = state;
    dictError.style.display = state === 'denied' ? 'block' : 'none';
    dictBtn.disabled      = state === 'processing' || state === 'denied';
    dictBtn.title = {
      idle:       'Dictate — click to start',
      listening:  'Dictating — click to stop',
      processing: 'Finishing transcription…',
      denied:     'Microphone access denied',
    }[state] ?? '';
  }

  // Flush the current utterance buffer to Whisper, append result to input.
  function flushUtterance() {
    clearTimeout(dictSilTimer);
    const chunks = dictChunks;
    dictChunks    = [];
    dictHasSpeech = false;
    dictUttStart  = Date.now();

    const totalSamples = chunks.reduce((n, c) => n + c.length, 0);
    if (totalSamples < MIN_UTTERANCE_SAMP) return;   // too short — skip

    dictQ = dictQ.then(async () => {
      const pcm = new Float32Array(totalSamples);
      let off = 0;
      for (const c of chunks) { pcm.set(c, off); off += c.length; }

      const b64 = bufferToBase64(encodePcmAsWav(pcm, dictRate));
      try {
        const { transcript } = await window.electronAPI.transcribe(b64);
        if (transcript) {
          const cur = inputEl.value.trimEnd();
          inputEl.value = cur ? cur + ' ' + transcript : transcript;
          inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length);
        }
      } catch (err) {
        console.error('[dictation] chunk failed:', err);
      }
    });
  }

  async function startDictation() {
    try {
      dictStream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
      });
    } catch (err) {
      const denied = ['NotAllowedError', 'PermissionDeniedError', 'NotFoundError'];
      if (denied.includes(err.name)) { applyDictState('denied'); return; }
      console.error('[dictation] getUserMedia:', err);
      return;
    }

    dictCtx       = new AudioContext();
    dictRate      = dictCtx.sampleRate;
    dictSource    = dictCtx.createMediaStreamSource(dictStream);
    dictProcessor = dictCtx.createScriptProcessor(4096, 1, 1);
    dictChunks    = [];
    dictHasSpeech = false;
    dictUttStart  = Date.now();
    dictQ         = Promise.resolve();

    dictProcessor.onaudioprocess = (e) => {
      const data = e.inputBuffer.getChannelData(0);
      dictChunks.push(new Float32Array(data));   // copy — buffer is reused

      // RMS energy check
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
      const rms = Math.sqrt(sum / data.length);

      if (rms >= SILENCE_THRESHOLD) {
        dictHasSpeech = true;
        clearTimeout(dictSilTimer);
        // Force-flush if a single utterance runs too long without a pause
        if (Date.now() - dictUttStart >= MAX_UTTERANCE_MS) flushUtterance();
      } else if (dictHasSpeech) {
        // Silence detected after speech — start countdown to flush
        clearTimeout(dictSilTimer);
        dictSilTimer = setTimeout(flushUtterance, SILENCE_MS);
      }
    };

    dictSource.connect(dictProcessor);
    dictProcessor.connect(dictCtx.destination);
    applyDictState('listening');
  }

  async function stopDictation() {
    clearTimeout(dictSilTimer);

    // 1. Tear down the audio graph.
    if (dictProcessor) { dictProcessor.disconnect(); dictProcessor = null; }
    if (dictSource)    { dictSource.disconnect();    dictSource    = null; }
    if (dictCtx)       { await dictCtx.close();      dictCtx       = null; }

    // 2. RELEASE the OS mic stream immediately — system indicator goes dark
    //    before any remaining transcription work is done.
    if (dictStream) {
      dictStream.getTracks().forEach(t => t.stop());
      dictStream = null;
    }

    // 3. Flush any audio still in the buffer since the last silence.
    if (dictHasSpeech && dictChunks.length) flushUtterance();
    else dictChunks = [];

    // 4. Wait for all in-flight transcriptions to settle, then return to idle.
    if (dictQ !== Promise.resolve()) applyDictState('processing');
    await dictQ;
    applyDictState('idle');
  }

  dictBtn.addEventListener('click', () => {
    if (dictState === 'idle')           startDictation();
    else if (dictState === 'listening') stopDictation();
    // processing / denied: no-op
  });

  // ── WAV encoder ────────────────────────────────────────────────────────────
  // Produces a valid RIFF/WAV file from a Float32 mono PCM array.

  function encodePcmAsWav(samples, sampleRate) {
    const dataBytes = samples.length * 2;     // 16-bit = 2 bytes per sample
    const buf  = new ArrayBuffer(44 + dataBytes);
    const view = new DataView(buf);

    const str = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };

    str(0, 'RIFF');  view.setUint32(4,  36 + dataBytes,   true);
    str(8, 'WAVE');
    str(12, 'fmt '); view.setUint32(16, 16,               true);
                     view.setUint16(20, 1,                true);   // PCM
                     view.setUint16(22, 1,                true);   // mono
                     view.setUint32(24, sampleRate,       true);
                     view.setUint32(28, sampleRate * 2,   true);   // byte rate
                     view.setUint16(32, 2,                true);   // block align
                     view.setUint16(34, 16,               true);   // bits/sample
    str(36, 'data'); view.setUint32(40, dataBytes,        true);

    let i = 44;
    for (const s of samples) {
      const c = Math.max(-1, Math.min(1, s));
      view.setInt16(i, c < 0 ? c * 0x8000 : c * 0x7FFF, true);
      i += 2;
    }
    return buf;
  }

  // Chunked to avoid call-stack overflow on large ArrayBuffers.
  function bufferToBase64(buf) {
    const bytes  = new Uint8Array(buf);
    const CHUNK  = 8192;
    let binary   = '';
    for (let i = 0; i < bytes.length; i += CHUNK) {
      binary += String.fromCharCode(...bytes.subarray(i, i + CHUNK));
    }
    return btoa(binary);
  }
