<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../tokens.css">
  <style>
    /* ── Base ────────────────────────────────────────────────── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--color-bg);
      width: 100vw; height: 100vh;
      display: flex; flex-direction: column;
      border-radius: var(--radius-lg); overflow: hidden;
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-lg);
      -webkit-app-region: no-drag;
      position: relative;
    }

    /* ── Titlebar ─────────────────────────────────────────────── */
    #titlebar {
      -webkit-app-region: drag;
      background: var(--color-surface);
      padding: 10px 12px 10px 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0; height: 52px;
    }
    #titlebar h1 {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary);
      letter-spacing: var(--letter-spacing-tight);
    }
    .titlebar-actions {
      display: flex; gap: var(--space-sm); align-items: center;
      -webkit-app-region: no-drag;
    }
    .titlebar-btn {
      -webkit-app-region: no-drag;
      width: 34px; height: 34px; border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
      background: var(--color-surface-2);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      transition: background var(--duration-fast) var(--ease),
                  border-color var(--duration-fast) var(--ease);
    }
    .titlebar-btn:hover { background: var(--color-surface-active); }
    /* Account button */
    #accountBtn {
      display: flex; align-items: center; gap: 6px;
      padding: 0 var(--space-sm) 0 5px;
      height: 34px;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
      background: var(--color-surface-2);
      color: var(--color-text-secondary);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
      font-family: var(--font-family);
      cursor: pointer;
      transition: background var(--duration-fast) var(--ease),
                  border-color var(--duration-fast) var(--ease),
                  color var(--duration-fast) var(--ease);
    }
    #accountBtn:hover,
    #accountBtn.is-open {
      background: var(--color-surface-active);
      border-color: var(--color-accent);
      color: var(--color-text-primary);
    }
    .acct-initial {
      width: 22px; height: 22px;
      border-radius: var(--radius-full);
      background: var(--color-accent-subtle);
      color: var(--color-accent);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .acct-name {
      max-width: 80px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .acct-chevron { font-size: 9px; color: var(--color-text-muted); }

    /* ── Chips ────────────────────────────────────────────────── */
    #chips {
      background: var(--color-bg); padding: var(--space-sm) var(--space-md);
      display: flex; gap: var(--space-sm);
      border-bottom: 1px solid var(--color-border); flex-shrink: 0;
    }
    .chip {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-full); padding: 3px 10px;
      font-size: var(--font-size-xs); color: var(--color-text-secondary);
      font-weight: var(--font-weight-medium);
    }

    /* ── Messages ─────────────────────────────────────────────── */
    #messages {
      flex: 1; overflow-y: auto;
      padding: var(--space-sm) var(--space-md);
      display: flex; flex-direction: column; gap: var(--space-sm);
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb {
      background: var(--color-border); border-radius: var(--radius-sm);
    }
    .bubble {
      max-width: 75%; padding: 9px 13px;
      border-radius: var(--radius-lg); font-size: var(--font-size-base);
      line-height: var(--line-height-normal); word-wrap: break-word;
      white-space: pre-line;   /* renders \n as real line breaks — used by
                                   the "which one?" numbered candidate list */
    }
    .bubble.user {
      align-self: flex-end;
      background: var(--color-bubble-user-bg);
      color: var(--color-bubble-user-text);
      border-bottom-right-radius: var(--radius-sm);
    }
    .bubble.pistachio {
      align-self: flex-start;
      background: var(--color-surface); color: var(--color-text-primary);
      border-bottom-left-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm);
    }
    /* Action result — a finished tool outcome, not a chat message. Centered
       and pill-shaped so it reads as a system line, distinct from .user/.pistachio.
       Modifier class is the executor's literal status value. */
    .bubble.action {
      align-self: center;
      max-width: 88%;
      display: flex; align-items: baseline; gap: 7px;
      padding: 7px 13px;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
      background: var(--color-surface-2);
      color: var(--color-text-secondary);
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-medium);
    }
    .bubble.action .action-glyph { flex-shrink: 0; }
    .bubble.action.success {
      background: var(--color-accent-subtle);
      border-color: var(--color-accent);
      color: var(--color-accent-on);
    }
    .bubble.action.app_disabled,
    .bubble.action.os_denied,
    .bubble.action.needs_permission {
      background: var(--color-danger-subtle);
      border-color: var(--color-danger);
      color: var(--color-danger);
    }
    .bubble.action.error {
      border-color: var(--color-neutral);
      color: var(--color-text-muted);
    }

    #typing { display: none; align-self: flex-start; }
    #typing.show { display: flex; }
    .dot {
      width: 6px; height: 6px; background: var(--color-accent);
      border-radius: var(--radius-full); margin: 0 2px;
      animation: bounce 1s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1); }
    }
    #empty {
      flex: 1; display: flex; align-items: center;
      justify-content: center; color: var(--color-text-muted);
      font-style: italic; font-size: var(--font-size-base);
    }

    /* ── Input bar ───────────────────────────────────────────── */
    #inputbar {
      background: var(--color-surface); border-top: 1px solid var(--color-border);
      padding: 10px 12px; display: flex; gap: var(--space-sm);
      align-items: center; flex-shrink: 0;
    }
    #input {
      flex: 1; background: var(--color-surface-2);
      border: 1px solid var(--color-border); border-radius: var(--radius-full);
      padding: 8px 14px; font-size: var(--font-size-base);
      font-family: var(--font-family); outline: none;
      color: var(--color-text-primary);
      transition: border-color var(--duration-fast) var(--ease);
    }
    #input::placeholder { color: var(--color-text-muted); }
    #input:focus { border-color: var(--color-accent); }
    #sendBtn {
      width: 34px; height: 34px; border-radius: var(--radius-full);
      background: var(--color-accent); border: none; color: white;
      font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--duration-fast) var(--ease);
    }
    #sendBtn:hover { background: var(--color-accent-hover); }

    /* ── Dictation button ────────────────────────────────────── */
    #dictBtn {
      width: 34px; height: 34px; flex-shrink: 0;
      border-radius: var(--radius-full);
      border: 1.5px solid var(--color-border);
      background: transparent; color: var(--color-text-muted);
      font-size: 15px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition:
        background   var(--duration-normal) var(--ease),
        border-color var(--duration-normal) var(--ease),
        color        var(--duration-normal) var(--ease),
        opacity      var(--duration-normal) var(--ease);
    }
    #dictBtn:hover:not(:disabled):not([data-state="listening"]) {
      background: var(--color-surface-2); color: var(--color-text-secondary);
    }
    #dictBtn[data-state="listening"] {
      background: var(--color-accent-subtle); border-color: var(--color-accent);
      color: var(--color-accent);
      animation: dictate-breathe 1.8s ease-in-out infinite;
    }
    #dictBtn[data-state="processing"] {
      background: var(--color-surface-2); border-color: var(--color-border);
      color: var(--color-text-muted); cursor: wait;
    }
    #dictBtn[data-state="denied"], #dictBtn:disabled {
      color: var(--color-neutral); border-color: var(--color-border);
      opacity: 0.55; cursor: not-allowed;
    }
    @keyframes dictate-breathe {
      0%, 100% { opacity: 1;    transform: scale(1);    }
      50%       { opacity: 0.55; transform: scale(0.93); }
    }
    #dictError {
      display: none; padding: var(--space-sm) var(--space-md);
      background: var(--color-surface-2); border-top: 1px solid var(--color-border);
      font-size: var(--font-size-xs); line-height: var(--line-height-normal);
      color: var(--color-text-secondary); flex-shrink: 0;
    }

    /* ── Settings overlay ────────────────────────────────────── */
    #settingsOverlay {
      position: fixed; top: 52px; right: var(--space-md);
      width: 284px; z-index: 100;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;

      opacity: 0; pointer-events: none;
      transform: scale(0.96) translateY(-6px);
      transform-origin: top right;
      transition:
        opacity   var(--duration-normal) var(--ease),
        transform var(--duration-normal) var(--ease);
    }
    #settingsOverlay.is-open {
      opacity: 1; pointer-events: auto;
      transform: scale(1) translateY(0);
    }

    .ov-section { padding: var(--space-sm) var(--space-md); }
    .ov-divider { height: 1px; background: var(--color-border); }

    /* Identity */
    .ov-identity {
      display: flex; align-items: center; gap: var(--space-sm);
      padding: var(--space-md);
    }
    .ov-avatar {
      width: 38px; height: 38px; border-radius: var(--radius-full);
      background: var(--color-accent-subtle); color: var(--color-accent);
      font-size: var(--font-size-md); font-weight: var(--font-weight-semibold);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .ov-name {
      font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold);
      color: var(--color-text-primary); line-height: var(--line-height-tight);
    }
    .ov-email {
      font-size: var(--font-size-xs); color: var(--color-text-muted);
      margin-top: 2px; word-break: break-all;
    }

    /* Rows */
    .ov-row {
      display: flex; align-items: center;
      justify-content: space-between;
      gap: var(--space-sm); min-height: 34px;
      padding: 3px 0;
    }
    .ov-label {
      display: flex; align-items: center; gap: var(--space-xs);
      font-size: var(--font-size-sm); color: var(--color-text-secondary);
      font-weight: var(--font-weight-medium); flex-shrink: 0; min-width: 56px;
    }

    /* Volume slider */
    .ov-ctrl-group { display: flex; align-items: center; gap: var(--space-sm); flex: 1; }
    .ov-slider {
      flex: 1; height: 4px;
      -webkit-appearance: none; appearance: none;
      border-radius: var(--radius-full); outline: none; cursor: pointer;
      background: linear-gradient(
        to right,
        var(--color-accent) 0%,
        var(--color-accent) var(--val, 80%),
        var(--color-border) var(--val, 80%),
        var(--color-border) 100%
      );
    }
    .ov-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px; border-radius: var(--radius-full);
      background: var(--color-accent); cursor: pointer;
      border: 2px solid var(--color-surface);
      box-shadow: var(--shadow-sm);
    }
    .ov-value {
      font-size: var(--font-size-xs); color: var(--color-text-muted);
      min-width: 32px; text-align: right; font-variant-numeric: tabular-nums;
    }

    /* Theme segmented — full pill */
    .ov-segmented {
      display: flex; background: var(--color-surface-2);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-full); padding: 3px; gap: 3px;
    }
    .ov-seg-btn {
      border: none; border-radius: var(--radius-full);
      background: transparent; color: var(--color-text-muted);
      font-size: var(--font-size-xs); font-weight: var(--font-weight-medium);
      font-family: var(--font-family); cursor: pointer;
      padding: 5px 11px;
      display: flex; align-items: center; gap: 5px;
      transition:
        background var(--duration-fast) var(--ease),
        color      var(--duration-fast) var(--ease),
        box-shadow var(--duration-fast) var(--ease);
    }
    .ov-seg-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
    .ov-seg-btn.active {
      background: var(--color-surface); color: var(--color-text-primary);
      box-shadow: var(--shadow-sm);
    }

    /* Pill selects */
    .pill-select { position: relative; display: inline-block; }
    .pill-select::after {
      content: ""; pointer-events: none;
      position: absolute; right: 11px; top: 50%;
      width: 6px; height: 6px;
      border-right: 1.6px solid var(--color-text-muted);
      border-bottom: 1.6px solid var(--color-text-muted);
      transform: translateY(-70%) rotate(45deg);
    }
    .ov-select {
      -webkit-appearance: none; appearance: none;
      font-size: var(--font-size-sm); font-family: var(--font-family);
      background: var(--color-surface-2); color: var(--color-text-primary);
      border: 1px solid var(--color-border); border-radius: var(--radius-full);
      padding: 6px 26px 6px 11px; outline: none; cursor: pointer;
      transition: border-color var(--duration-fast) var(--ease);
    }
    .ov-select:focus { border-color: var(--color-accent); }

    /* Settings — opens the separate Settings window (DND, Screen watch,
       Calendar). Left-aligned row, same shape as Sign out below. */
    .ov-settings-link {
      display: flex; align-items: center; justify-content: flex-start;
      gap: var(--space-sm);
      width: 100%; min-height: 34px; padding: 3px 0;
      border: none; border-radius: var(--radius-sm);
      background: transparent; color: var(--color-text-secondary);
      font-size: var(--font-size-sm); font-weight: var(--font-weight-medium);
      font-family: var(--font-family); cursor: pointer;
      transition: background var(--duration-fast) var(--ease);
    }
    .ov-settings-link:hover { background: var(--color-surface-active); }

    /* Sign out — left-aligned row, no border box */
    .ov-signout {
      display: flex; align-items: center; justify-content: flex-start;
      gap: var(--space-sm);
      width: 100%; min-height: 34px; padding: 3px 0;
      border: none; border-radius: var(--radius-sm);
      background: transparent; color: var(--color-danger);
      font-size: var(--font-size-sm); font-weight: var(--font-weight-medium);
      font-family: var(--font-family); cursor: pointer;
      transition: background var(--duration-fast) var(--ease);
    }
    .ov-signout:hover { background: var(--color-danger-subtle); }

    /* ── Settings popup ───────────────────────────────────────
       A deeper panel over the whole window, inset on all four sides so
       the chat behind stays visible — no separate BrowserWindow, no
       close button. Vertical list format; closes back to the account
       menu on outside click (wired in the script below). */
    #settingsPopup {
      position: fixed; inset: var(--space-lg);
      z-index: 200;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow-y: auto;

      opacity: 0; pointer-events: none;
      transform: scale(0.97);
      transition:
        opacity   var(--duration-normal) var(--ease),
        transform var(--duration-normal) var(--ease);
    }
    #settingsPopup.is-open {
      opacity: 1; pointer-events: auto;
      transform: scale(1);
    }
    #settingsPopup .sp-section { padding: var(--space-md); }
    #settingsPopup .sp-divider { height: 1px; background: var(--color-border); }

    .sp-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--space-md); cursor: pointer;
    }
    .sp-copy { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .sp-title {
      font-size: var(--font-size-sm); color: var(--color-text-primary);
      font-weight: var(--font-weight-semibold);
    }
    .sp-help {
      font-size: var(--font-size-xs); color: var(--color-text-muted);
      line-height: var(--line-height-normal);
    }
    /* Green when on, grey when off — same accent as the volume slider. */
    .sp-toggle {
      -webkit-appearance: none; appearance: none;
      width: 38px; height: 22px; border-radius: var(--radius-full); flex-shrink: 0;
      background: var(--color-neutral); border: none; position: relative;
      cursor: pointer; transition: background var(--duration-fast) var(--ease);
    }
    .sp-toggle::before {
      content: ''; position: absolute; top: 2px; left: 2px;
      width: 18px; height: 18px; border-radius: var(--radius-full);
      background: var(--color-surface); box-shadow: var(--shadow-sm);
      transition: transform var(--duration-fast) var(--ease);
    }
    .sp-toggle:checked          { background: var(--color-accent); }
    .sp-toggle:checked::before  { transform: translateX(16px); }
    .sp-row.child { padding-left: 22px; gap: 10px; margin-top: 14px; }
    .sp-row.child .sp-title { font-size: var(--font-size-xs); }
    .sp-row.disabled { opacity: 0.45; }
    .sp-row.disabled .sp-toggle { cursor: default; }
    .sp-coming-soon {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.3px;
      color: var(--color-text-muted); font-weight: var(--font-weight-semibold);
      margin-left: 6px;
    }
    /* Calendar's nested "manage individual permissions" disclosure —
       collapsed by default, native <details>, no JS needed to open/close. */
    .sp-cal-manage { margin-top: 14px; }
    .sp-cal-manage summary {
      list-style: none; cursor: pointer; user-select: none;
      font-size: var(--font-size-xs); color: var(--color-text-muted);
      display: flex; align-items: center; gap: 4px;
    }
    .sp-cal-manage summary::-webkit-details-marker { display: none; }
    .sp-cal-manage summary::after { content: '›'; transition: transform var(--duration-fast) var(--ease); }
    .sp-cal-manage[open] summary::after { transform: rotate(90deg); }
    .sp-child-list { display: flex; flex-direction: column; }

    /* Learned scheduling preferences (S5) — a second, equally-buried
       <details> disclosure below the calendar block; same subdued
       styling as .sp-cal-manage so it never competes for attention. */
    .sp-sched-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--space-sm); padding: 6px 0;
    }
    .sp-sched-row .sp-title {
      font-size: var(--font-size-xs); font-weight: var(--font-weight-normal);
      color: var(--color-text-primary); line-height: var(--line-height-normal);
    }
    .sp-forget-btn {
      flex-shrink: 0; border: 1px solid var(--color-border); border-radius: var(--radius-sm);
      background: transparent; color: var(--color-text-muted);
      font-size: 10px; font-weight: var(--font-weight-semibold);
      text-transform: uppercase; letter-spacing: 0.3px;
      padding: 4px 8px; cursor: pointer; font-family: var(--font-family);
      transition: background var(--duration-fast) var(--ease),
                  color var(--duration-fast) var(--ease),
                  border-color var(--duration-fast) var(--ease);
    }
    .sp-forget-btn:hover {
      background: var(--color-danger-subtle); color: var(--color-danger); border-color: var(--color-danger);
    }
    .sp-forget-all { width: 100%; text-align: center; margin-top: 10px; }
    .sp-sched-empty {
      font-size: var(--font-size-xs); color: var(--color-text-muted); padding: 4px 0;
    }
  </style>
</head>
<body>

  <!-- Titlebar -->
  <div id="titlebar">
    <h1>Pistachio</h1>
    <div class="titlebar-actions">
      <button id="accountBtn">
        <span class="acct-initial" id="accountInitial">A</span>
        <span class="acct-name"    id="accountName">account</span>
        <span class="acct-chevron">▾</span>
      </button>
    </div>
  </div>

  <!-- Chips -->
  <div id="chips">
    <span class="chip" id="chipMood">chill</span>
    <span class="chip" id="chipActivity">unknown</span>
    <span class="chip" id="chipLocation">unknown</span>
  </div>

  <!-- Messages -->
  <div id="messages">
    <div id="empty">say something...</div>
    <div id="typing" class="bubble pistachio">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
  </div>

  <!-- Input bar -->
  <div id="inputbar">
    <button id="dictBtn" data-state="idle" title="Dictate — click to start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="22"/></svg></button>
    <input id="input" type="text" placeholder="message pistachio…" />
    <button id="sendBtn">↑</button>
  </div>
  <div id="dictError">
    Microphone access is needed for dictation. Enable it in<br>
    System Settings › Privacy &amp; Security › Microphone, then relaunch.
  </div>

  <!-- Settings overlay — layered over chat, anchored top-right -->
  <div id="settingsOverlay">

    <div class="ov-section ov-identity">
      <div class="ov-avatar" id="ovAvatar">A</div>
      <div>
        <div class="ov-name"  id="ovName">account</div>
        <div class="ov-email" id="ovEmail">—</div>
      </div>
    </div>

    <div class="ov-divider"></div>

    <div class="ov-section">
      <div class="ov-row">

  </div>

  <!-- Settings popup — a second, deeper panel opened from the account
       overlay's "Settings" row. Stays in this window (no separate
       BrowserWindow); inset from all four edges so the chat behind stays
       visible. No close button — clicking outside it returns to the
       account menu (see the document click handler in the script below). -->
  <div id="settingsPopup">
    <div class="sp-section">
      <label class="sp-row" for="dndToggle">
        <div class="sp-copy">
          <span class="sp-title">Do Not Disturb</span>
          <span class="sp-help">Pause check-ins and nudges — shared with the tray menu.</span>

        <input type="checkbox" id="dndToggle" class="sp-toggle">

    <div class="sp-divider"></div>

    <div class="sp-section">
      <label class="sp-row" for="screenWatchToggle">
        <div class="sp-copy">
          <span class="sp-title">Screen watch</span>
          <span class="sp-help">Let her see what's on your screen — shared with the tray menu.</span>
        </div>
        <input type="checkbox" id="screenWatchToggle" class="sp-toggle">
      </label>
    </div>

    <div class="sp-divider"></div>

    <div class="sp-section">
      <label class="sp-row" for="calendarMasterToggle">
        <div class="sp-copy">
          <span class="sp-title">Calendar</span>
          <span class="sp-help">Master switch — off means she can't touch your calendar at all.</span>
        </div>
        <input type="checkbox" id="calendarMasterToggle" class="sp-toggle">
      </label>

      <details class="sp-cal-manage">
        <summary>Manage individual permissions</summary>
        <!-- Repeatable row pattern — each future action is just another
             .sp-row.child here. Shipping an action = remove its `disabled`. -->
        <div class="sp-child-list">
          <label class="sp-row child" for="calCreateToggle" id="calCreateRow">
            <div class="sp-copy">
              <span class="sp-title">Add events</span>
              <span class="sp-help">She can add events when you ask.</span>
            </div>
            <input type="checkbox" id="calCreateToggle" class="sp-toggle">
          </label>
          <label class="sp-row child" for="calListToggle" id="calListRow">
            <div class="sp-copy">
              <span class="sp-title">List events</span>
              <span class="sp-help">She can look up what's on your calendar.</span>
            </div>
            <input type="checkbox" id="calListToggle" class="sp-toggle">
          </label>
          <label class="sp-row child" for="calMoveToggle" id="calMoveRow">
            <div class="sp-copy">
              <span class="sp-title">Move events</span>
              <span class="sp-help">She can reschedule existing events.</span>
            </div>
            <input type="checkbox" id="calMoveToggle" class="sp-toggle">
          </label>
          <label class="sp-row child" for="calDeleteToggle" id="calDeleteRow">
            <div class="sp-copy">
              <span class="sp-title">Delete events</span>
              <span class="sp-help">She can remove events from your calendar (single events only — not repeating ones).</span>
            </div>
